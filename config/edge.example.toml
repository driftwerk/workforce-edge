# Example configuration for the standalone `workforce-edge` service.
#
# The edge is deployed on its own, with its own Postgres and its own Weaviate,
# isolated from the internal hub. Point the binary at this file:
#
#     workforce-edge /etc/workforce-edge/edge.toml
#
# or set WORKFORCE_EDGE_CONFIG. Secrets should come from the environment in
# production (e.g. `url = "${EDGE_PG_URL}"` is NOT expanded here — inject the
# real value via your secrets manager and render this file, or keep secrets out
# of the file and template it at deploy time).

[server]
# Address the public + widget surface binds to. Behind a public ALB in prod.
bind = "0.0.0.0:8080"
# Proxy CIDRs trusted to set X-Forwarded-For, so per-IP rate limiting keys on
# the real client rather than the load balancer.
trusted_proxies = ["10.0.0.0/8"]
# Per-IP public request budget per minute.
rate_limit_per_min = 60
# Ceiling on agent turns running concurrently across all sockets. Keep it below
# the Postgres pool (default 16) so turns don't starve each other on a
# connection.
max_concurrent_turns = 8

# The edge's OWN Postgres — customer sessions live here. Never the hub's DB.
[postgres]
url = "postgres://edge:CHANGE_ME@edge-db.internal:5432/workforce_edge"
# TLS mode: "require" (default — managed Postgres over the network) or
# "disable" (local plaintext dev only).
sslmode = "require"
# Seconds to keep retrying the initial connection before aborting boot.
connect_budget_secs = 300

# The edge's OWN Weaviate — agent memory + the customer-facing training corpus.
[weaviate]
url = "http://edge-weaviate.internal:8080"
# Required: the edge's own class, never the hub's WorkforceMemory.
collection = "EdgeMemory"
# An edge that kept its memories in its Weaviate's WorkforceMemory class (the
# old default) names it here, beside its own class: memories move into
# `collection` while the edge serves, one replica copying at a time, and
# forgetting and erasure reach both. Boot refuses a class that holds anything
# but the edge's memories, or that does not exist. To give it up afterwards:
# remove this line and deploy, then
#   workforce-edge memory drop-previous --config edge.toml --collection WorkforceMemory [--apply]
# `workforce-edge memory check-previous --config edge.toml` reports on it.
# previous_collection = "WorkforceMemory"
# api_key = "CHANGE_ME"   # when the instance is authenticated
connect_budget_secs = 300

[llm]
# Provider: "anthropic" (default), "bedrock", "gemini", "openrouter", …
#
# Harbor runs on AWS Bedrock using the task's IAM role — no API key. Leave
# api_key unset; credentials come from the task role, region from AWS_REGION.
provider = "bedrock"
# api_key = "sk-ant-CHANGE_ME"   # required for "anthropic"; unused for "bedrock"
#
# Tier-resolution family. Lets an agent's `model = "powerful"` map to the right
# concrete model. Defaults from the provider (bedrock -> "bedrock.anthropic").
# tier_key = "bedrock.anthropic"
#
# Install-wide default model when an agent doesn't pin one: a tier
# ("powerful" / "standard" / "cheap") or a concrete model id.
default_model = "standard"

# OPTIONAL. Prometheus metrics at GET /metrics (the edge_mcp_* series; see the
# README). Off unless enabled. When on, a scraper must send
# `Authorization: Bearer <bearer_token>`; the token must be at least 32
# characters, and the endpoint is never served without one.
# [metrics]
# enabled = true
# bearer_token = "${EDGE_METRICS_TOKEN}"

# One or more customer-facing agents. Each is embeddable in the company webapp
# whose origins it names.
[[agents]]
id = "harbor-help"
display_name = "Harbor Assistant"
# The persona / instructions that become the agent's system prompt.
system_prompt = """
You are the Harbor customer assistant. Help the logged-in user with their
orders, invoices, and account. Be concise and friendly. Only act through the
tools you are given; never claim to have done something you did not do.
"""
# Greeting shown when a new conversation opens.
welcome = "Hi! I can help with your orders, invoices, and account. What do you need?"
# Optional per-agent model override — a tier or a concrete id; falls back to
# [llm].default_model.
# model = "powerful"

[agents.embed]
# Web origins allowed to load the widget and open a socket. Exact match only.
allowed_origins = ["https://app.harbor.example"]
# Closed tool allowlist. A tool is callable only if it matches exactly or via a
# `prefix.*` glob. Empty ⇒ the agent calls no tools.
allowed_tools = ["harbor.*"]
# Keycloak realm issuer that must have signed a customer's token.
keycloak_issuer = "https://auth.harbor.example/realms/harbor"
# Pin the audience, or omit to verify signature + issuer + expiry only.
# keycloak_audience = "harbor-web"

[agents.embed.mcp]
# The company MCP server this agent acts against, as the logged-in customer.
url = "https://mcp.harbor.example"
# OPTIONAL. A service credential to discover the tool list at startup: before
# the agent serves when the server is required, in the background otherwise,
# so a server that is not required never delays boot or an admin save. Omit it
# and the tools are discovered lazily on the first customer turn using that
# customer's own token — for MCP servers that accept any valid user token.
# Per-customer tool calls always carry the customer's own token regardless.
# discovery_credential = "SERVICE_TOKEN"
# OPTIONAL, and the same on every server, this one included:
# - auth: "exchanged" (default) sends the turn's [token_exchange] token when
#   exchange is configured, else (or if the exchange fails) the customer's own
#   token. "forwarded" always sends the customer's own token.
# - audience: the audience this server's token is exchanged for, so a token
#   minted for it is not accepted by another server. Default: the
#   [token_exchange] audience. Only with auth = "exchanged".
# - required: whether this server being unavailable fails startup and the
#   turn. Default true here (the primary server) and false on an additional
#   server, whose outage only removes its tools for that turn. A server that
#   is not required and whose url cannot be used is left out of the agent
#   rather than failing it.
# - unavailable_skip_secs: how long a server that is not required sits out
#   after its startup discovery or turn start timed out or could not reach it
#   (connection refused, DNS, TLS, connect timeout). A server that answers
#   with an error, or whose address the outbound policy refuses, is retried
#   every turn. Default 60; 0 never skips.
# auth = "exchanged"
# audience = "harbor-mcp"

# OPTIONAL. More MCP servers alongside the primary one above. Each one has its
# own URL, credential, allowlist and write tiers. `allowed_tools` and
# `tool_grants` on [agents.embed] belong to the primary server.
#
# Tool names must be distinct across every server, compared with "." and "_"
# as the same character (that is how the model sees them). A config where two
# servers could expose the same name is refused, and the error names both.
# Give a server a `tool_prefix` to separate them: two servers that both have
# a `search` tool can both be used once one is `docs.search`.
#
# Every server receives a token that acts as the customer. Give each one its
# own `audience`, so a server can only use the token it was sent at that server.
# Servers without an audience share the [token_exchange] one.
#
# [[agents.embed.mcp_servers]]
# # Stable id: names the server in logs, errors, the admin API and the sealed
# # credential. Lowercase letters, digits and dashes; "default" is the
# # primary's.
# id = "docs"
# url = "https://docs-mcp.harbor.example/mcp"
# # discovery_credential = "DOCS_SERVICE_TOKEN"
# audience = "docs-mcp"
# # Exposes every tool as "docs.<tool>"; the server is still called with the
# # raw name.
# tool_prefix = "docs"
# # This server's closed allowlist, in the names the agent sees (prefix
# # included). Required.
# allowed_tools = ["docs.search", "docs.get_page"]
# # Write tiers on this server, exactly like [agents.embed] tool_grants.
# tool_grants = [{ source = "keycloak_role", requires = "docs-editor", tools = ["docs.edit_page"] }]
#
# [[agents.embed.mcp_servers]]
# id = "billing"
# url = "https://billing-mcp.harbor.example/mcp"
# auth = "forwarded"
# required = true
# allowed_tools = ["billing.list_invoices", "billing.get_invoice"]

[agents.embed.branding]
title = "Harbor Help"
accent_color = "#2563eb"

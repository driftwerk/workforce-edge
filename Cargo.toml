[workspace]
resolver = "2"
members = [
    "crates/edge",
]

[workspace.package]
version = "0.1.7"
edition = "2021"
license = "Elastic-2.0"
publish = false
repository = "https://github.com/driftwerk/workforce-edge"

[workspace.dependencies]
# Core crates from the public Workforce repository, pinned to one revision.
# To build against a local core checkout, see `.cargo/config.toml`.
workforce-agent = { git = "https://github.com/driftwerk/workforce", rev = "34d04b1ae7962f4973b00ca7550be7a731a6ef33" }
workforce-build-support = { git = "https://github.com/driftwerk/workforce", rev = "34d04b1ae7962f4973b00ca7550be7a731a6ef33" }
workforce-common = { git = "https://github.com/driftwerk/workforce", rev = "34d04b1ae7962f4973b00ca7550be7a731a6ef33" }
workforce-core = { git = "https://github.com/driftwerk/workforce", rev = "34d04b1ae7962f4973b00ca7550be7a731a6ef33" }
workforce-crypto = { git = "https://github.com/driftwerk/workforce", rev = "34d04b1ae7962f4973b00ca7550be7a731a6ef33" }
workforce-lessons = { git = "https://github.com/driftwerk/workforce", rev = "34d04b1ae7962f4973b00ca7550be7a731a6ef33" }
workforce-mcp-client = { git = "https://github.com/driftwerk/workforce", rev = "34d04b1ae7962f4973b00ca7550be7a731a6ef33" }
workforce-memory = { git = "https://github.com/driftwerk/workforce", rev = "34d04b1ae7962f4973b00ca7550be7a731a6ef33" }
workforce-playbook = { git = "https://github.com/driftwerk/workforce", rev = "34d04b1ae7962f4973b00ca7550be7a731a6ef33" }
workforce-policy = { git = "https://github.com/driftwerk/workforce", rev = "34d04b1ae7962f4973b00ca7550be7a731a6ef33" }
workforce-postgres = { git = "https://github.com/driftwerk/workforce", rev = "34d04b1ae7962f4973b00ca7550be7a731a6ef33" }

argon2 = "0.5"
async-trait = "0.1.85"
axum = { version = "0.8.1", features = ["macros", "ws"] }
bytes = "1.10.0"
color-eyre = "0.6.3"
deadpool-postgres = "0.14.1"
eyre = "0.6.12"
futures = "0.3.31"
once_cell = "1.20.2"
parking_lot = "0.12.3"
refinery = { version = "0.8.12", features = ["tokio-postgres"] }
regex = "1.11.1"
reqwest = { version = "0.12.12", features = ["json", "stream", "multipart"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.138", features = ["float_roundtrip"] }
thiserror = "2.0.11"
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "sync", "time", "process", "fs", "io-util", "net", "signal"] }
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8.19"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "json", "env-filter"] }
url = "2.5"

[profile.dev]
debug = 0

name: Image

# Every push to main — a direct push or a merged pull request — builds the edge
# image and pushes it to Docker Hub as `sha-<commit>` and `latest`. Pull
# requests never run this workflow, and its Docker Hub credentials live in the
# `dockerhub` environment, which only main may use.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: kingsleyh/driftwerk-edge
  NODE_OPTIONS: --max-old-space-size=6144
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  image:
    name: Build and push the edge image
    # Older than the Debian runtime image, so the binary never needs a newer
    # glibc than the image has.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: dockerhub
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release
      - name: Build the UIs the binary embeds
        run: |
          for ui in widget-ui ui-admin ui-platform; do
            npm --prefix "crates/edge/$ui" ci --no-audit --no-fund
            npm --prefix "crates/edge/$ui" run build
          done
      - name: Build the release binary
        run: |
          cargo build --release -p workforce-edge
          mkdir -p bins
          cp target/release/workforce-edge bins/workforce-edge
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.edge
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

[package]
name = "workforce-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "workforce-edge"
path = "src/main.rs"

[lib]
name = "workforce_edge"
path = "src/lib.rs"

[dependencies]
workforce-common = { workspace = true, features = ["postgres"] }
workforce-memory = { workspace = true }
workforce-agent = { workspace = true }
workforce-core = { workspace = true }
workforce-policy = { workspace = true }
workforce-mcp-client = { workspace = true }
workforce-playbook = { workspace = true }
workforce-lessons = { workspace = true }
# Seals per-tenant secrets at rest under `EDGE_MASTER_KEY`.
workforce-crypto = { workspace = true }
# The platform API creates and drops a vellev tenant per edge tenant with the
# install's admin key; the store itself is `workforce-memory`'s.
vellev-client = "0.1"
vellev-core = "0.1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
argon2 = { workspace = true }
getrandom = "0.2"
# PKCE (SHA-256 challenge) + base64url for the OIDC Authorization Code flow.
sha2 = "0.10"
base64 = "0.22"
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-postgres = { workspace = true }
# `tenant::TenantId` binds as a query parameter (`ToSql` writes into a
# `BytesMut`).
bytes = { workspace = true }
# The tenant-scoped connection (`tenant::TenantConn`) holds a pooled object
# and detaches it from the pool when dropped mid-transaction.
deadpool-postgres = { workspace = true }
# Embedded per-schema migrations for the `edge_analytics` store (mirrors the
# sessions store's refinery setup in workforce-common).
refinery = { workspace = true }
async-trait = { workspace = true }
axum = { version = "0.8", features = ["ws", "multipart"] }
# Training-file text extraction (uploads). Same versions the hub loaders use.
pdf-extract = "0.10"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
quick-xml = "0.31"
tower-http = { version = "0.6", features = ["cors"] }
futures = { workspace = true }
ipnetwork = "0.20"
uuid = { version = "1", features = ["v4"] }
url = "2"
eyre = { workspace = true }
color-eyre = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
glob = "0.3"
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"

# Scratch space for the attachment binary-fallback path.
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"
# Drives the router in-process (`ServiceExt::oneshot`) for the tenant tests.
tower = { version = "0.5", features = ["util"] }
# A websocket client against the served router, for the socket tests.
tokio-tungstenite = "0.28"
# Shared embedded-Postgres harness for the `edge_analytics` DB tests.
workforce-postgres = { workspace = true, features = ["test-support"] }

[build-dependencies]
workforce-build-support = { workspace = true }
